<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifas Gratis - Generador de Códigos</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@5/dist/fp.min.js"></script>
</head>
<body>
    <div class="page-container">
        <div class="columns">
            <!-- COLUMNA IZQUIERDA: Código -->
            <div class="col col-left">
                <h1>Generador de Códigos</h1>

                <div id="fingerprint-status" class="status">
                    <span class="spinner"></span> Identificando navegador...
                </div>

                <button id="generateBtn" disabled>Generar Código</button>

                <div id="result" class="hidden">
                    <h2>Tu Código</h2>
                    <div class="code-box">
                        <span id="code"></span>
                        <button id="copyBtn">Copiar</button>
                    </div>
                    <a id="linkB" href="#" target="_blank" class="btn-link">Ir al Punto B</a>
                </div>

                <div id="msg" class="hidden"></div>
            </div>

            <!-- COLUMNA DERECHA: Donación -->
            <div class="col col-right">
                <h2>¿Por qué donar?</h2>
                <p id="donation-phrase" class="donation-phrase"></p>
                <p class="donation-sub">Cada donación ayuda a mantener los servidores y seguir mejorando este proyecto.</p>

                <img id="donation-qr" src="" alt="QR Donación" class="donation-qr">
                <p class="wallet-label">Envía en la red Polygon:</p>
                <div class="code-box wallet">
                    <span id="wallet-address" class="wallet-addr"></span>
                    <button id="copyWalletBtn">Copiar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
